<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jeanne Baby Shower Breakfast Order</title><style>body{font-family:Arial,sans-serif;background:#fff7fa;max-width:800px;margin:auto;padding:20px}.card{background:#fff;padding:25px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}h1{color:#d85b8c}.total{font-size:24px;font-weight:bold;color:#d85b8c;margin-top:15px}button{background:#d85b8c;color:#fff;border:none;padding:12px 20px;border-radius:8px;width:100%}input,select{width:100%;padding:10px;margin:8px 0}</style></head><body><div class="card"><h1>🍎 Jeanne's Baby Shower Breakfast Order</h1><p>Replace YOUR_PAYID and YOUR_SCRIPT_URL before publishing.</p><label>Name</label><input id="name"><label>Mobile</label><input id="mobile"><label>Main Meal</label><select id="meal" onchange="calcTotal()"><option value="36">Mediterranean Breakfast ($36)</option><option value="26">Green Bowl ($26)</option><option value="26">Lebs-Benedict ($26)</option><option value="22">MISC Turkish Eggs ($22)</option><option value="23">Mushroom Fold Over Pita ($23)</option><option value="25">Schnitzel Fold Over Pita ($25)</option><option value="25">Fried Mortadella Fold Over Pita ($25)</option><option value="24">French Toast ($24)</option><option value="19">Pistachio Hotcake ($19)</option></select><h3>Extras</h3><label><input type="checkbox" class="extra" value="5" onchange="calcTotal()"> Poached Egg (+$5)</label><br><label><input type="checkbox" class="extra" value="13" onchange="calcTotal()"> Grilled Salmon (+$13)</label><br><label><input type="checkbox" class="extra" value="3" onchange="calcTotal()"> Mini Pita (+$3)</label><br><label><input type="checkbox" class="extra" value="10" onchange="calcTotal()"> Bacon (+$10)</label><br><label><input type="checkbox" class="extra" value="10" onchange="calcTotal()"> Chorizo (+$10)</label><br><label><input type="checkbox" class="extra" value="5" onchange="calcTotal()"> Vanilla Ice Cream (+$5)</label><br><label><input type="checkbox" class="extra" value="7" onchange="calcTotal()"> Add Hotcake (+$7)</label><div class="total">Total (incl. 10% surcharge): $<span id="total"></span></div><h3>Payment</h3><p>PayID: <b>YOUR_PAYID</b><br>Reference: <b>MISC - Your Name</b></p><button onclick="submitOrder()">Submit Order</button></div><script>function calcTotal(){let meal=+document.getElementById('meal').value;let extras=0;document.querySelectorAll('.extra').forEach(x=>{if(x.checked)extras+=+x.value});let subtotal=meal+extras;let total=subtotal*1.10;document.getElementById('total').innerText=total.toFixed(2);}calcTotal();async function submitOrder(){const data={name:document.getElementById('name').value,mobile:document.getElementById('mobile').value,total:document.getElementById('total').innerText};await fetch('https://script.google.com/macros/s/AKfycbyGRJISu_lGFD9DJtuzXDh6w0ttTIsp2r_QaDOAJApdgw3yyTJAUsV_Ai1CyQb0Kiz3Lw/exec',{method:'POST',body:JSON.stringify(data)});alert('Order submitted!');}</script></body></html>
